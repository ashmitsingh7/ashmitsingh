<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:2500}}">
class Component extends DCLogic {
  componentDidMount() {
    const reduce = typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) return;
  }
  componentWillUnmount() {
    if (this.timer) clearInterval(this.timer);
  }
  renderVals() {
    const s = this.state || {};
    const step = s.step || 0;
    const V = '#9DB4FF';
    const R = '#E8C766';
    const T = (arr) => arr.map((t) => ({ t }));
    const base = 'https://github.com/ashmitsingh7/';
    const list = [
      { mode: 'VLSI', color: V, artBg: '#0F1B47', title: 'Harris Corner Detector ASIC', text: 'A streaming Harris corner detector in SystemVerilog, taken to a routed layout and checked against a bit-exact reference model.', tags: T(['Computer Vision', 'SystemVerilog', 'Genus', 'Innovus', 'Conformal LEC']), href: base + 'harris-corner-detector' },
      { mode: 'ROBOTICS', color: R, artBg: '#3A0916', title: 'Warehouse DWS at Delhivery', text: 'Parcel-measuring station built solo at Delhivery. An Intel RealSense D455 and point-cloud vision (RANSAC, PCA) size each parcel; tested on 100+ real shipments.', tags: T(['Computer Vision', 'RealSense D455', 'Point Clouds', 'ROS2', 'FastAPI']), href: base + 'dws' },
      { mode: 'VLSI', color: V, artBg: '#0F1B47', title: 'Load-Aware Adaptive H-Bridge', text: 'A brushed-DC motor driver that senses its own load and eases off the PWM as current climbs, instead of waiting for a hard cutoff. Built in Cadence at 90 nm.', tags: T(['Virtuoso', 'Spectre', 'gpdk090', 'Current Sensing', 'Adaptive PWM']), href: base + 'Adaptive-Motor-Driver' },
      { mode: 'ROBOTICS', color: R, artBg: '#3A0916', title: 'Team Vyadh Robotic Arm', text: 'Control stack for a Mars rover arm: ROS 2 Jazzy on a Jetson drives seven motor channels on an STM32, which owns ramping and a hardware watchdog.', tags: T(['ROS 2 Jazzy', 'Jetson Orin Nano', 'STM32', 'Motor Control', 'AS5600']), href: base + 'Team-Vyadh-Robotic-Arm' },
      { mode: 'VLSI', color: V, artBg: '#0F1B47', title: 'Reliability-Aware DFT', text: 'A robotic SoC that tests itself while it runs. A reliability-aware scheduler decides what to check and when, ranking blocks by criticality, health and age.', tags: T(['DFT', 'MBIST', 'SystemVerilog', 'Python', 'Yosys']), href: base + 'reliability-aware-dft-robotic-soc' },
      { mode: 'ROBOTICS', color: R, artBg: '#3A0916', title: 'Gesture-Controlled Arm', text: "Wave your hand and the arm follows. OpenCV and MediaPipe track hand landmarks from a webcam and stream them over WiFi to an ESP32, which drives the arm's joints.", tags: T(['Computer Vision', 'OpenCV', 'MediaPipe', 'ESP32', 'Arduino']), href: base + 'robotic-arm-vision-control' },
      { mode: 'VLSI', color: V, artBg: '#0F1B47', title: 'PID Hardware Accelerator', text: 'A PID controller implemented as RTL instead of software, so the control loop runs in dedicated logic. It sits right where robotics, control and VLSI meet.', tags: T(['Verilog', 'RTL', 'PID Control', 'Hardware Acceleration']), href: base + 'PID_Hardware_Accelerator' }
    ];
    const art = [0, 4, 1, 5, 2, 6, 3];
    const n = list.length;
    const front = ((step % n) + n) % n;
    const cards = list.map((c, k) => ({
      ...c,
      angle: (k * 360 / n).toFixed(4),
      opacity: k === front ? 1 : 0.45,
      a0: art[k] === 0, a1: art[k] === 1, a2: art[k] === 2, a3: art[k] === 3, a4: art[k] === 4, a5: art[k] === 5, a6: art[k] === 6
    }));
    const go = (k) => () => {
      let d = (((k - front) % n) + n) % n;
      if (d > 3) d -= n;
      this.setState({ step: step + d });
    };
    return {
      cards,
      ring: 'rotateY(' + (-step * 360 / n) + 'deg)',
      prev: () => this.setState({ step: step - 1 }),
      next: () => this.setState({ step: step + 1 }),
      tstart: (e) => { const t = (e.touches && e.touches[0]) || e; this.dragX = t.clientX; this.setState({ paused: true }); },
      tend: (e) => {
        const t = (e.changedTouches && e.changedTouches[0]) || e;
        const dx = this.dragX == null ? 0 : t.clientX - this.dragX;
        this.dragX = null;
        if (Math.abs(dx) > 40) this.setState({ step: step + (dx < 0 ? 1 : -1), paused: false });
        else this.setState({ paused: false });
      },
      pause: () => this.setState({ paused: true }),
      resume: () => this.setState({ paused: false }),
      dots: list.map((c, k) => ({
        label: 'Show ' + c.title,
        w: k === front ? '28px' : '10px',
        bg: k === front ? '#E8C766' : '#4A4A4A',
        go: go(k)
      })),
      caption: (front + 1) + ' / ' + n + '   ' + list[front].title,
      groups: [
        { title: 'Chip design', color: V, items: T(['SystemVerilog', 'Verilog', 'Genus', 'Innovus', 'Tempus', 'Conformal LEC', 'Virtuoso', 'Spectre', 'QuestaSim', 'Xcelium', 'Verilator', 'Quartus', 'Yosys', 'Tcl', 'Perl']) },
        { title: 'Robotics and embedded', color: R, items: T(['ROS 2 Jazzy', 'STM32', 'ESP32', 'Arduino', 'Jetson Orin Nano', 'Altium Designer', 'Fusion 360', 'Simulink', 'PID control', 'Encoders and motor drivers']) },
        { title: 'Vision and software', color: '#E4E4DF', items: T(['Python', 'OpenCV', 'MediaPipe', 'Open3D', 'RealSense', 'FastAPI', 'SQLite', 'pytest']) }
      ]
    };
  }
}
</script>
