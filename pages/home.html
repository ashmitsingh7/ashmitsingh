<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
  componentDidMount() {
    const start = () => {
      const ov = document.getElementById('intro');
      if (!ov) return;
      const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce || /nointro/.test(window.location.search)) { ov.remove(); return; }
      const track = document.getElementById('introTrack');
      const words = Array.prototype.slice.call(track.querySelectorAll('[data-w]'));
      const lh = words[0].offsetHeight;
      const cy = ov.clientHeight / 2;
      const s = 3, F = words.length - 1, dur = 3800;
      let raf = 0, gone = false;
      const lift = () => {
        if (gone) return; gone = true; cancelAnimationFrame(raf);
        ov.style.transition = 'transform 900ms cubic-bezier(0.7, 0, 0.2, 1)';
        ov.style.transform = 'translateY(-100%)';
        setTimeout(() => ov.remove(), 1000);
      };
      ov.addEventListener('click', lift);
      window.addEventListener('keydown', lift, { once: true });
      const t0 = performance.now();
      const frame = (now) => {
        if (gone) return;
        const p = Math.min(1, (now - t0) / dur);
        const e = 1 - Math.pow(1 - p, 3);
        const y = cy - lh / 2 - (s + (F - s) * e) * lh;
        track.style.transform = 'translate3d(0,' + y + 'px,0)';
        for (let i = 0; i < words.length; i++) {
          const d = Math.abs(i * lh + lh / 2 + y - cy) / lh;
          const k = Math.max(0, 1 - d);
          words[i].style.opacity = (0.2 + 0.8 * k).toFixed(3);
        }
        if (p < 1) raf = requestAnimationFrame(frame); else setTimeout(lift, 900);
      };
      raf = requestAnimationFrame(frame);
    };
    setTimeout(start, 60);
  }
  renderVals() {
    return {};
  }
}
</script>
